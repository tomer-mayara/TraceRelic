name: Local collector
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_PASSWORD: collector_test_only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TRACERELIC_TEST_DATABASE_URL: postgresql://postgres:collector_test_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Check the database connection before building
        run: DATABASE_URL="$TRACERELIC_TEST_DATABASE_URL" bun run --silent db:check
      - name: Build workspace
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Compile history contract
        run: bun run schema:collector-history
      - name: Compile storage contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run schema:collector-storage
      - name: Compile scan contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run schema:collector-scan
      - name: Check collector dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check:collector-deps
      - name: Check collector structure
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:collector-structure
      - name: Test collector history and configuration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run --cwd apps/collector check:history-scenarios && bun run --cwd apps/collector check:config-scenarios
      - name: Test collector storage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run --cwd apps/collector check:storage-scenarios
      - name: Test collector scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run --cwd apps/collector check:scan-scenarios
      - name: Test collector HTTP API
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run --cwd apps/api check:collector-scenarios
      - name: Test PostgreSQL writes, API restarts and collector scans
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run --cwd apps/api check:postgres-scenarios
      - name: Test shared logging
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check:logging-contract && bun run --cwd packages/shared check:logging-scenarios
      - name: Lint workspace
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Run workspace tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:compiled
